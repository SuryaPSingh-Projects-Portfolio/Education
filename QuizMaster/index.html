<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - Test Your Knowledge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        /* Welcome Screen */
        .welcome-screen {
            text-align: center;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        /* Quiz Screen */
        .quiz-screen {
            display: none;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .timer {
            font-size: 1.5em;
            font-weight: 700;
            color: #667eea;
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 10px;
        }

        .progress {
            font-size: 1.1em;
            color: #666;
        }

        .question-card {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .question-number {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .question-text {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 25px;
            color: #333;
        }

        .question-text pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .question-text code {
            font-family: 'Courier New', monospace;
        }

        .options {
            display: grid;
            gap: 15px;
        }

        .option {
            background: white;
            padding: 18px 25px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.05em;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .quiz-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        /* Results Screen */
        .results-screen {
            display: none;
            text-align: center;
        }

        .score-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .score-display h2 {
            font-size: 2em;
            margin-bottom: 15px;
        }

        .score-display .score {
            font-size: 4em;
            font-weight: 700;
        }

        .score-display .percentage {
            font-size: 1.5em;
            opacity: 0.9;
        }

        .results-list {
            text-align: left;
            max-height: 600px;
            overflow-y: auto;
            padding: 20px;
        }

        .result-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #ddd;
        }

        .result-item.correct {
            border-left-color: #28a745;
        }

        .result-item.incorrect {
            border-left-color: #dc3545;
        }

        .result-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .result-answer {
            margin-bottom: 8px;
        }

        .result-answer.correct {
            color: #28a745;
            font-weight: 600;
        }

        .result-answer.incorrect {
            color: #dc3545;
            font-weight: 600;
        }

        .result-explanation {
            color: #666;
            font-size: 0.95em;
            line-height: 1.5;
            background: #e9ecef;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .question-text {
                font-size: 1.1em;
            }

            .quiz-header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>

    <div class="container">
        <div class="header">
            <h1>🎯 QuizMaster</h1>
            <p>Test Your Knowledge Across Multiple Topics</p>
        </div>

        <div class="content">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="form-group">
                    <label for="userName">Enter Your Name:</label>
                    <input type="text" id="userName" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="topicSelect">Select a Topic:</label>
                    <select id="topicSelect" required>
                        <option value="">-- Choose a topic --</option>
                        <option value="csharp">C# Programming</option>
                        <option value="sql">SQL Database</option>
                        <option value="grafana">Grafana</option>
                        <option value="ai">Artificial Intelligence</option>
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="docker">Docker</option>
                        <option value="git">Git Version Control</option>
                        <option value="custom">Other (Custom)</option>
                    </select>
                </div>

                <div class="form-group" id="customTopicGroup" style="display: none;">
                    <label for="customTopic">Enter Custom Topic:</label>
                    <input type="text" id="customTopic" placeholder="e.g., java, react, nodejs">
                    <small style="color: #666; font-size: 0.9em; margin-top: 5px; display: block;">Available topics: csharp, sql, grafana, ai, javascript, python, docker, git</small>
                </div>

                <div class="form-group">
                    <label for="questionCount">Number of Questions:</label>
                    <select id="questionCount" required>
                        <option value="5">5 Questions</option>
                        <option value="10">10 Questions</option>
                        <option value="15">15 Questions</option>
                        <option value="20">20 Questions</option>
                        <option value="25" selected>25 Questions</option>
                    </select>
                </div>

                <button class="btn" onclick="startQuiz()">Start Quiz</button>
                
                <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                    <button class="btn" onclick="exportQuestionBank()" style="background: #667eea; font-size: 0.9em; padding: 10px 20px;">Export Questions</button>
                    <label for="importFile" class="btn" style="background: #764ba2; font-size: 0.9em; padding: 10px 20px; cursor: pointer;">
                        Import Questions
                        <input type="file" id="importFile" accept=".json" onchange="importQuestionBank(this.files[0])" style="display: none;">
                    </label>
                    <button class="btn" onclick="clearCache()" style="background: #f56565; font-size: 0.9em; padding: 10px 20px;">Clear Cache</button>
                </div>
            </div>

            <!-- Quiz Screen -->
            <div class="quiz-screen" id="quizScreen">
                <div class="quiz-header">
                    <div class="timer" id="timer">00:00</div>
                    <div class="progress" id="progress">Question 1 of 25</div>
                </div>

                <div class="question-card">
                    <div class="question-number" id="questionNumber">Question 1</div>
                    <div class="question-text" id="questionText">Loading question...</div>
                    <div class="options" id="optionsContainer">
                        <!-- Options will be dynamically inserted -->
                    </div>
                </div>

                <div class="quiz-buttons">
                    <button class="btn" id="prevBtn" onclick="previousQuestion()" disabled>Previous</button>
                    <button class="btn" id="nextBtn" onclick="nextQuestion()">Next</button>
                </div>
            </div>

            <!-- Results Screen -->
            <div class="results-screen" id="resultsScreen">
                <div class="score-display">
                    <h2 id="resultGreeting">Great Job!</h2>
                    <div class="score" id="finalScore">0/25</div>
                    <div class="percentage" id="percentage">0%</div>
                </div>

                <div class="results-list" id="resultsList">
                    <!-- Results will be dynamically inserted -->
                </div>

                <button class="btn" onclick="restartQuiz()" style="margin-top: 30px;">Take Another Quiz</button>
            </div>
        </div>
    </div>

        function truncateWords(text, maxWords = 200) {
            if (!text) return '';
            const words = String(text).trim().split(/\s+/);
            if (words.length <= maxWords) return String(text).trim();
            return words.slice(0, maxWords).join(' ') + '…';
        }

        function buildQuizFromBank(topic, count) {
            const pool = questionBank[topic];
            if (!pool || pool.length === 0) return null;
            return shuffleArray([...pool]).slice(0, Math.min(count, pool.length));

        // Validate if topic is technology-related
        function isTechnologyTopic(topic) {
            const lowerTopic = topic.toLowerCase();
            // Only check if the topic contains a technology keyword (more strict)
            return technologyKeywords.some(keyword => 
                lowerTopic.includes(keyword)
            );
        }

        // localStorage caching for AI-generated questions
        const CACHE_KEY_PREFIX = 'quizmaster_cache_';
        const CACHE_DURATION_DAYS = 7; // Cache expires after 7 days

        function saveToCache(topic, questions) {
            const cacheData = {
                questions: questions,
                timestamp: Date.now(),
                topic: topic
            };
            localStorage.setItem(`${CACHE_KEY_PREFIX}${topic}`, JSON.stringify(cacheData));
            console.log(`Saved ${questions.length} questions to cache for topic: ${topic}`);
        }

        function loadFromCache(topic) {
            const cached = localStorage.getItem(`${CACHE_KEY_PREFIX}${topic}`);
            if (!cached) return null;

            try {
                const cacheData = JSON.parse(cached);
                const cacheAge = Date.now() - cacheData.timestamp;
                const maxAge = CACHE_DURATION_DAYS * 24 * 60 * 60 * 1000;

                if (cacheAge > maxAge) {
                    console.log(`Cache expired for topic: ${topic}`);
                    localStorage.removeItem(`${CACHE_KEY_PREFIX}${topic}`);
                    return null;
                }

                console.log(`Loaded ${cacheData.questions.length} questions from cache for topic: ${topic}`);
                return cacheData.questions;
            } catch (error) {
                console.error('Error loading from cache:', error);
                return null;
            }
        }

        function clearCache(topic) {
            if (topic) {
                localStorage.removeItem(`${CACHE_KEY_PREFIX}${topic}`);
                console.log(`Cleared cache for topic: ${topic}`);
            } else {
                // Clear all quiz caches
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith(CACHE_KEY_PREFIX)) {
                        localStorage.removeItem(key);
                    }
                });
                console.log('Cleared all quiz caches');
            }
        }

        // Export question bank to JSON file
        function exportQuestionBank() {
            const dataStr = JSON.stringify(questionBank, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'questions_export.json';
            link.click();
            URL.revokeObjectURL(url);
            console.log('Question bank exported');
        }

        // Save updated question bank to questions.json (automatic download)
        function saveQuestionBankToFile() {
            const dataStr = JSON.stringify(questionBank, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'questions.json';
            link.click();
            URL.revokeObjectURL(url);
            console.log('Question bank saved to questions.json');
        }

        // Merge AI questions into local question bank
        function mergeAIQuestionsToBank(topic, questions) {
            if (!questionBank[topic]) {
                questionBank[topic] = [];
            }
            
            // Add only new questions (avoid duplicates based on question text)
            let addedCount = 0;
            questions.forEach(newQ => {
                const exists = questionBank[topic].some(q => q.question === newQ.question);
                if (!exists) {
                    questionBank[topic].push(newQ);
                    addedCount++;
                }
            });
            
            if (addedCount > 0) {
                console.log(`Added ${addedCount} new questions to local bank for topic: ${topic}`);
                // Automatically save the updated question bank
                saveQuestionBankToFile();
            }
            
            return addedCount;
        }

        // Import question bank from JSON file
        function importQuestionBank(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    // Merge with existing question bank
                    Object.keys(imported).forEach(topic => {
                        if (!questionBank[topic]) {
                            questionBank[topic] = [];
                        }
                        // Add only new questions (avoid duplicates based on question text)
                        imported[topic].forEach(newQ => {
                            const exists = questionBank[topic].some(q => q.question === newQ.question);
                            if (!exists) {
                                questionBank[topic].push(newQ);
                            }
                        });
                    });
                    console.log('Question bank imported successfully');
                    alert('Question bank imported successfully!');
                } catch (error) {
                    console.error('Error importing question bank:', error);
                    alert('Error importing question bank. Please check the file format.');
                }
            };
            reader.readAsText(file);
        }

        // Generate questions using AI (Puter.js - Free, No API Key Required)
        async function generateQuestionsWithAI(topic, count) {
            try {
                console.log('Generating questions with AI for topic:', topic, 'count:', count);
                
                const prompt = `Generate ${count} multiple choice quiz questions about ${topic} programming. 
                Return ONLY valid JSON in this exact format:
                [
                    {
                        "question": "Question text here",
                        "options": ["Option A", "Option B", "Option C", "Option D"],
                        "correct": 0,
                        "explanation": "Brief explanation under 200 words"
                    }
                ]
                
                Requirements:
                - Exactly ${count} questions
                - Each question must have exactly 4 options
                - "correct" must be 0, 1, 2, or 3 (index of correct answer)
                - Questions should vary in difficulty (easy to hard)
                - Cover different aspects of ${topic}
                - If question contains code snippets, wrap them in <pre><code>...</code></pre> HTML tags for proper formatting
                - Return ONLY the JSON array, no other text`;

                console.log('Sending prompt to AI...');
                const response = await puter.ai.chat(prompt, { model: "gpt-5.4-nano" });
                console.log('AI response received:', response);
                
                // Handle response - it might be an object with a content property
                let responseText = '';
                if (typeof response === 'object' && response !== null) {
                    if (response.message && response.message.content) {
                        responseText = response.message.content;
                    } else if (response.content) {
                        responseText = response.content;
                    } else if (response.message) {
                        responseText = response.message;
                    } else if (response.text) {
                        responseText = response.text;
                    } else {
                        // Fallback to stringifying the whole object if content not found
                        responseText = JSON.stringify(response);
                    }
                } else {
                    responseText = String(response);
                }
                
                console.log('Response text to parse:', responseText);
                
                // Parse the AI response as JSON
                const jsonMatch = responseText.match(/\[[\s\S]*\]/);
                if (!jsonMatch) {
                    console.error('No JSON found in response');
                    throw new Error('AI response does not contain valid JSON');
                }
                
                const questions = JSON.parse(jsonMatch[0]);
                console.log('Parsed questions:', questions);
                
                // Validate the format
                if (!Array.isArray(questions) || questions.length === 0) {
                    throw new Error('AI did not return valid question array');
                }
                
                // Validate each question
                const validQuestions = questions.filter(q => {
                    return q.question && 
                           Array.isArray(q.options) && 
                           q.options.length === 4 &&
                           typeof q.correct === 'number' &&
                           q.correct >= 0 && q.correct <= 3 &&
                           q.explanation;
                });
                
                if (validQuestions.length === 0) {
                    throw new Error('AI did not return valid questions');
                }
                
                console.log('Valid questions:', validQuestions.length);
                
                // Save to cache
                saveToCache(topic, validQuestions.slice(0, count));
                
                return validQuestions.slice(0, count);
            } catch (error) {
                console.error('Error generating questions with AI:', error);
                return null;
            }
        }

        // Decode HTML entities
        function decodeHTML(html) {
            const txt = document.createElement('textarea');
            txt.innerHTML = html;
            return txt.value;
        }

        // Start Quiz
        async function startQuiz() {
            userName = document.getElementById('userName').value.trim();
            selectedTopic = document.getElementById('topicSelect').value;
            questionCount = parseInt(document.getElementById('questionCount').value);

            if (!userName) {
                alert('Please enter your name');
                return;
            }

            if (!selectedTopic) {
                alert('Please select a topic');
                return;
            }

            // Handle custom topic
            if (selectedTopic === 'custom') {
                const customTopic = document.getElementById('customTopic').value.trim().toLowerCase();
                if (!customTopic) {
                    alert('Please enter a custom topic');
                    return;
                }
                
                // Validate if custom topic is technology-related
                if (!isTechnologyTopic(customTopic)) {
                    alert('Please select a computer technology topic only (e.g., azure, react, kubernetes, python). Non-technology topics like "inorganic chemistry" are not supported.');
                    return;
                }
                
                // Allow custom topics - AI can generate questions for any technology
                // Only validate if topic exists in question bank for fallback
                if (!questionBank[customTopic]) {
                    console.log(`Custom topic '${customTopic}' not in local bank, will use AI generation`);
                    questionBank[customTopic] = []; // Initialize empty array for this topic
                }
                selectedTopic = customTopic;
            }

            // Show loading state - clear previous quiz content first
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('quizScreen').style.display = 'block';
            
            // Clear previous quiz content
            document.getElementById('optionsContainer').innerHTML = '';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('progress').textContent = 'Loading...';
            document.getElementById('questionText').textContent = 'Loading questions...';

            const localQuiz = buildQuizFromBank(selectedTopic, questionCount);
            const cachedQuestions = loadFromCache(selectedTopic);

            if (localQuiz && localQuiz.length >= questionCount) {
                currentQuestions = localQuiz;
                console.log('Using local question bank');
            } else if (cachedQuestions && cachedQuestions.length >= questionCount) {
                currentQuestions = shuffleArray([...cachedQuestions]).slice(0, questionCount);
                console.log('Using cached questions');
            } else {
                document.getElementById('questionText').textContent =
                    'Generating questions online (AI). This may take a minute…';
                const aiQuestions = await generateQuestionsWithAI(selectedTopic, questionCount);

                if (aiQuestions && aiQuestions.length > 0) {
                    currentQuestions = shuffleArray([...aiQuestions]).slice(0, questionCount);
                    mergeAIQuestionsToBank(selectedTopic, aiQuestions);
                } else if (localQuiz && localQuiz.length > 0) {
                    currentQuestions = localQuiz;
                    if (localQuiz.length < questionCount) {
                        alert(`Only ${localQuiz.length} questions available for this topic.`);
                    }
                } else if (cachedQuestions && cachedQuestions.length > 0) {
                    currentQuestions = shuffleArray([...cachedQuestions]).slice(0, questionCount);
                } else {
                    alert('No questions available. Open the app via a local server (see README) or check your connection for AI generation.');
                    document.getElementById('quizScreen').style.display = 'none';
                    document.getElementById('welcomeScreen').style.display = 'block';
                    return;
                }
            }

            userAnswers = new Array(currentQuestions.length).fill(null);
            currentQuestionIndex = 0;
            questionCount = currentQuestions.length;

            // Start timer
            startTimer();

            // Load first question
            loadQuestion();
        }

        // Shuffle array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Start Timer
        function startTimer() {
            timeElapsed = 0;
            timerInterval = setInterval(() => {
                timeElapsed++;
                const minutes = Math.floor(timeElapsed / 60);
                const seconds = timeElapsed % 60;
                document.getElementById('timer').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        // Load Question
        function loadQuestion() {
            const question = currentQuestions[currentQuestionIndex];
            document.getElementById('questionNumber').textContent = `Question ${currentQuestionIndex + 1} of ${questionCount}`;
            document.getElementById('questionText').innerHTML = question.question;
            document.getElementById('progress').textContent = `Question ${currentQuestionIndex + 1} of ${questionCount}`;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                if (userAnswers[currentQuestionIndex] === index) {
                    optionDiv.classList.add('selected');
                }
                optionDiv.textContent = option;
                optionDiv.onclick = () => selectOption(index);
                optionsContainer.appendChild(optionDiv);
            });

            // Update buttons
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').style.display = 'block';
            document.getElementById('nextBtn').textContent = 
                currentQuestionIndex === questionCount - 1 ? 'Finish' : 'Next';
        }

        // Select Option
        function selectOption(index) {
            userAnswers[currentQuestionIndex] = index;
            
            // Update UI
            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === index) {
                    opt.classList.add('selected');
                }
            });
        }

        // Previous Question
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        // Next Question
        function nextQuestion() {
            if (currentQuestionIndex < questionCount - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        // Finish Quiz
        function finishQuiz() {
            clearInterval(timerInterval);

            // Calculate score
            let correct = 0;
            currentQuestions.forEach((question, index) => {
                if (userAnswers[index] === question.correct) {
                    correct++;
                }
            });

            const percentage = Math.round((correct / questionCount) * 100);

            // Update results screen
            document.getElementById('resultGreeting').textContent = 
                percentage >= 80 ? 'Excellent!' : 
                percentage >= 60 ? 'Good Job!' : 
                percentage >= 40 ? 'Keep Practicing!' : 'Need More Study!';
            document.getElementById('finalScore').textContent = `${correct}/${questionCount}`;
            document.getElementById('percentage').textContent = `${percentage}%`;

            // Generate results list
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';

            currentQuestions.forEach((question, index) => {
                const isCorrect = userAnswers[index] === question.correct;
                const resultItem = document.createElement('div');
                resultItem.className = `result-item ${isCorrect ? 'correct' : 'incorrect'}`;
                
                resultItem.innerHTML = `
                    <div class="result-question">${index + 1}. ${question.question}</div>
                    <div class="result-answer ${isCorrect ? 'correct' : 'incorrect'}">
                        Your answer: ${userAnswers[index] !== null ? question.options[userAnswers[index]] : 'Not answered'}
                    </div>
                    ${!isCorrect ? `<div class="result-answer correct">Correct answer: ${question.options[question.correct]}</div>` : ''}
                    <div class="result-explanation">${truncateWords(question.explanation, 200)}</div>
                `;
                
                resultsList.appendChild(resultItem);
            });

            // Show results screen
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('resultsScreen').style.display = 'block';
        }

        // Restart Quiz
        function restartQuiz() {
            document.getElementById('resultsScreen').style.display = 'none';
            document.getElementById('welcomeScreen').style.display = 'block';
            document.getElementById('userName').value = '';
            document.getElementById('topicSelect').value = '';
            currentQuestions = [];
            userAnswers = [];
            currentQuestionIndex = 0;
            timeElapsed = 0;
        }
    </script>
</body>
</html>
